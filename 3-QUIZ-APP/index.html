<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="progress-track">
      <div id="progressFill"></div>
    </div>

    <div class="inner-header">
      <button id="back-btn"><span>﹤</span> Back</button>
      <h1>Welcome to my Quiz App!</h1>
      <div class="question-counter">
        <span id="current"></span><span>/</span><span id="total"></span>
      </div>
    </div>
  </header>

  <main>
    <div class="question-area"></div>
    <div class="answer-area"></div>
  </main>

  <footer>
    <h3>Built as part of the 10-Project JavaScript Consolidation Series.</h3>
  </footer>

  <script src="script.js"></script>
</body>
</html>
