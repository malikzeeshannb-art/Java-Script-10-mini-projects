<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript — 10 Mini Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d13;
    --panel: #10141c;
    --panel-hover: #141a24;
    --panel-border: #1d2430;
    --panel-border-dashed: #232b38;
    --text-primary: #e8ebf1;
    --text-secondary: #7c8699;
    --text-dim: #4b5568;
    --pass: #3fe08a;
    --pass-dim: #1c5c3d;
    --running: #5b9dff;
    --amber: #ffb454;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(91,157,255,0.07), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(63,224,138,0.05), transparent 42%);
    color: var(--text-primary);
    font-family: var(--mono);
    min-height: 100vh;
  }

  .page {
    max-width: 980px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  .eyebrow {
    font-family: var(--display);
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 6px; height: 6px;
    background: var(--pass);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--pass);
    flex-shrink: 0;
  }

  h1 {
    font-family: var(--display);
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    margin: 0 0 14px 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 14.5px;
    line-height: 1.7;
    max-width: 560px;
    margin: 0 0 34px 0;
  }
  .subtitle code {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--running);
  }

  /* progress track */
  .progress-wrap {
    margin-bottom: 46px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .progress-label .count {
    color: var(--pass);
    font-weight: 600;
  }
  .progress-track {
    display: flex;
    gap: 4px;
  }
  .progress-seg {
    height: 5px;
    flex: 1;
    border-radius: 3px;
    background: var(--panel-border);
  }
  .progress-seg.filled {
    background: var(--pass);
    box-shadow: 0 0 10px rgba(63,224,138,0.35);
  }

  /* grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .card.done:hover {
    border-color: var(--pass-dim);
    transform: translateY(-2px);
    background: var(--panel-hover);
  }
  .card.upcoming {
    border-style: dashed;
    border-color: var(--panel-border-dashed);
    opacity: 0.55;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-index {
    font-family: var(--display);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .status-pill {
    font-family: var(--display);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 20px;
  }
  .status-pill.done {
    color: var(--pass);
    background: rgba(63,224,138,0.12);
    border: 1px solid var(--pass-dim);
  }
  .status-pill.upcoming {
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--panel-border-dashed);
  }

  .card-title {
    font-family: var(--display);
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0;
  }
  .card.upcoming .card-title { color: var(--text-secondary); }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    font-size: 11px;
    color: var(--text-secondary);
    background: rgba(124,134,153,0.08);
    border: 1px solid var(--panel-border);
    padding: 3px 8px;
    border-radius: 5px;
  }

  .card-links {
    display: flex;
    gap: 14px;
    margin-top: 4px;
    font-size: 12.5px;
  }
  .card-links a {
    color: var(--running);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .card-links a:hover { text-decoration: underline; }
  .card-links a:focus-visible { outline: 2px solid var(--running); outline-offset: 3px; border-radius: 3px; }

  .locked-note {
    font-size: 12px;
    color: var(--text-dim);
  }

  footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12px;
    color: var(--text-dim);
  }
  footer a { color: var(--text-secondary); text-decoration: none; }
  footer a:hover { color: var(--running); }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="eyebrow">javascript learning journey</div>
  <h1>10 Mini Projects</h1>
  <p class="subtitle">
    A consolidation series built with plain <code>HTML</code>, <code>CSS</code>, and <code>JavaScript</code> —
    no frameworks, no shortcuts. Each project combines core fundamentals into a real, working app.
  </p>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Progress</span>
      <span class="count" id="progress-count">1 / 10 complete</span>
    </div>
    <div class="progress-track" id="progress-track"></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span>Built one project at a time.</span>
    <a href="https://github.com/malikzeeshannb-art/Java-Script-10-mini-projects" target="_blank" rel="noopener">View full repository on GitHub →</a>
  </footer>
</div>

<script>
  /*
    HOW TO ADD YOUR NEXT PROJECT:
    Just add one object to this array. Nothing else in this file needs to change —
    the card, the link, the progress bar, and the URL encoding are all generated
    automatically from this list (same array + forEach pattern used in the To-Do List project).

    folder  → must match the exact folder name in the repo, including the "#"
    status  → "done" once the project folder actually exists and works, otherwise "upcoming"
    tags    → short list of concepts used, shown on the card
  */
  const projects = [
    {
      id: "01",
      title: "To-Do List",
      folder: "1-TO-DO-list",
      status: "done",
      tags: ["arrays", "DOM", "localStorage"]
    },
    
    { id: "02",
     title: "Calculator",
     folder: "2-Calculator",
     status: "done",
     tags: ["DOM", "functions", "Events", "Tough-logic"]
    },

    { id: "03", title: "Quiz App",           folder: "3-Quiz-App",           status: "upcoming", tags: [] },
    { id: "04", title: "Registration Form",  folder: "4-Registration-Form",  status: "upcoming", tags: [] },
    { id: "05", title: "Expense Tracker",    folder: "5-Expense-Tracker",    status: "upcoming", tags: [] },
    { id: "06", title: "Weather Card",       folder: "6-Weather-Card",       status: "upcoming", tags: [] },
    { id: "07", title: "Library Manager",    folder: "7-Library-Manager",    status: "upcoming", tags: [] },
    { id: "08", title: "Notes App",          folder: "8-Notes-App",          status: "upcoming", tags: [] },
    { id: "09", title: "Shopping Cart",      folder: "9-Shopping-Cart",      status: "upcoming", tags: [] },
    { id: "10", title: "Personal Dashboard", folder: "10-Personal-Dashboard",status: "upcoming", tags: ["capstone"] },
  ];

  const REPO_URL = "https://github.com/malikzeeshannb-art/Java-Script-10-mini-projects";

  const grid = document.getElementById('grid');
  const progressTrack = document.getElementById('progress-track');
  const progressCount = document.getElementById('progress-count');

  const doneCount = projects.filter(p => p.status === "done").length;
  progressCount.textContent = `${doneCount} / ${projects.length} complete`;

  projects.forEach(p => {
    // progress segment
    const seg = document.createElement('div');
    seg.className = 'progress-seg' + (p.status === 'done' ? ' filled' : '');
    progressTrack.appendChild(seg);

    // encode the folder name safely — handles the "#" and any spaces automatically
    const encodedFolder = encodeURIComponent(p.folder);
    const liveHref = `./${encodedFolder}/index.html`;
    const sourceHref = `${REPO_URL}/tree/main/${encodedFolder}`;

    const card = document.createElement('div');
    card.className = 'card ' + p.status;

    const tagsHtml = p.tags.map(t => `<span class="tag">${t}</span>`).join('');

    if (p.status === 'done') {
      card.innerHTML = `
        <div class="card-top">
          <span class="card-index">#${p.id}</span>
          <span class="status-pill done">Completed</span>
        </div>
        <h2 class="card-title">${p.title}</h2>
        ${p.tags.length ? `<div class="card-tags">${tagsHtml}</div>` : ''}
        <div class="card-links">
          <a href="${liveHref}">▶ Live demo</a>
          <a href="${sourceHref}" target="_blank" rel="noopener">⌥ Source</a>
        </div>
      `;
    } else {
      card.innerHTML = `
        <div class="card-top">
          <span class="card-index">#${p.id}</span>
          <span class="status-pill upcoming">Upcoming</span>
        </div>
        <h2 class="card-title">${p.title}</h2>
        <span class="locked-note">Not built yet — check back soon.</span>
      `;
    }

    grid.appendChild(card);
  });
</script>

</body>
</html>
